name: Rust CI

on:
  # A PR is the feature-branch CI gate, so a push to that branch should not
  # enqueue another full copy of the same workflow and email twice on failure.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch commits so only the newest proposal consumes CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Enforce zero external Rust crates and frozen toolchain
        run: python3 scripts/check_rust_supply_chain.py
      - name: Dependency gate adversarial mutation tests
        run: python3 -m unittest discover -s tests -p test_rust_supply_chain.py -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check included snapshot file formatting
        run: rustfmt --check --edition 2021 src/registry_snapshot_impl.rs src/execution_snapshot_impl.rs src/ledger_channels_impl.rs src/ledger_settlement_impl.rs
      - name: Check included spot snapshot file formatting
        run: rustfmt --check --edition 2021 src/spot_snapshot_impl.rs
      - name: Check included joint snapshot file formatting
        run: rustfmt --check --edition 2021 src/joint_snapshot_impl.rs
      - name: Check included combined clearing snapshot formatting
        run: rustfmt --check --edition 2021 src/clearing_snapshot_impl.rs
      - name: Check included research distressed closeout formatting
        run: rustfmt --check --edition 2021 src/clearing_distress_impl.rs
      - name: Check included synthetic bilateral partial reduction formatting
        run: rustfmt --check --edition 2021 src/clearing_partial_impl.rs
      - name: Lint
        run: cargo clippy --all-targets --frozen -- -D warnings
      - name: Run tests
        run: cargo test --frozen
      - name: Stage 25C atomic PnL and replay fence tests
        run: cargo test --frozen --test clearing_mark_to_market
      - name: Stage 25D full clearing state checkpoint and fork recovery
        run: cargo test --frozen --test clearing_snapshot --test clearing_chain
      - name: Stage 25E2 real insurer reserve and v1/v2 checkpoint recovery
        run: cargo test --frozen --test insurance_ledger_v2
      - name: Stage 25E2B atomic full-book insured closeout and TLCC rollback
        run: cargo test --frozen --test insured_distressed_closeout
      - name: Stage 25F bounded synthetic bilateral closeout and TLCC rollback
        run: cargo test --frozen --test clearing_partial_closeout
      - name: Stage 25F pinned AMM priority and weighted-average accounting diagnostics
        run: cargo test --frozen --test liquidation_source_characterization
      - name: Stage 25E1 liquidation risk preflight and no-spend source budgets
        run: cargo test --frozen --test liquidation_preflight
      - name: Stage 25G unverified mark and two-of-two admission gate
        run: cargo test --frozen --test liquidation_input_gate
      - name: Stage 25H native P2WSH funding and witness structure (not signatures)
        run: cargo test --frozen --test channel_witness_audit
      - name: Stage 25I independent hashlib BIP143 and published vector
        run: python3 scripts/audit_bip143_channel_fixture.py
      - name: Stage 25J independent OpenSSL ECDSA two-signer test vectors
        run: python3 scripts/audit_channel_ecdsa_openssl.py --check
      - name: Stage 25J public-only signed 2-of-2 fixture Rust parity and always-deny
        run: cargo test --frozen --test channel_signed_evidence
      - name: Stage 25M independent Python BIP141 coinbase witness vectors
        run: python3 scripts/audit_bip141_witness_fixture.py
      - name: Stage 25M BIP141 witness block Merkle and permanent denial tests
        run: cargo test --frozen --test bitcoin_witness_commitment
      - name: Stage 25L independent Bitcoin P2WSH Merkle and witness non-auth oracle
        run: python3 scripts/audit_bitcoin_channel_merkle_fixture.py
      - name: Stage 25L dual Bitcoin Merkle inclusion and always-deny tests
        run: cargo test --frozen --test channel_inclusion_audit
      - name: Stage 25K independent RIPEMD160 HASH160 Python provider reference
        run: python3 scripts/audit_p2sh_hash160.py
      - name: Stage 25K legacy P2SH two-of-two script and outpoint, no ECDSA
        run: cargo test --frozen --test channel_p2sh_audit
      - name: Stage 25L independent legacy P2SH SIGHASH_ALL and OpenSSL ECDSA
        run: python3 scripts/audit_p2sh_legacy_ecdsa_openssl.py --check
      - name: Stage 25L Rust read-only P2SH signed-fixture parity and permanent denial
        run: cargo test --frozen --test channel_p2sh_signed_evidence
      - name: Stage 25M as-of direct clearlist revocation/fork and hard channel-auth refusal
        run: cargo test --frozen --test channel_admission_audit
      - name: Stage 25M independent Node type4/type19 pinned source-predicate subset
        run: node scripts/audit_historical_channel_lists.cjs
      - name: Pinned legacy channel A/B object guard and missing assignment authority
        run: node scripts/audit_legacy_channel_column_guard.cjs
      - name: Stage 25N independent Python synthetic type9 txid-Merkle vectors
        run: python3 scripts/audit_type9_merkle_vectors.py
      - name: Stage 25N Bitcoin raw type9 source origin and always-deny evidence
        run: cargo test --frozen --test channel_type9_inclusion_audit
      - name: Stage 25O pinned source type9 direct-vs-generic encoding regression
        run: node scripts/audit_type9_source_paths.cjs
      - name: Stage 25O independent OpenSSL ECDSA and P2WPKH Bech32 BIP143 fixture
        run: python3 scripts/audit_type9_p2wpkh_openssl.py --check
      - name: Stage 25O native P2WPKH first-input research and permanent authorization denial
        run: cargo test --frozen --test channel_type9_sender_audit
      - name: Legacy activation.js source-registry name and non-genesis parity oracle
        run: node scripts/audit_legacy_activation_parity.cjs
      - name: Pinned Validity activation helper versus registry height parity
        run: node scripts/audit_legacy_validity_activation.cjs
      - name: Legacy activation.js 36-type/33-threshold/Rust permanent-denial parity
        run: cargo test --frozen --test legacy_activation_audit
      - name: Legacy clearlist.js independent Node source collision and xpub Merkle oracle
        run: node scripts/audit_legacy_clearlist_source.cjs
      - name: Legacy clearlist.js source storage and root parity with default-deny tests
        run: cargo test --frozen --test legacy_clearlist_audit
      - name: Legacy channels.js independent Node direct A/B, crowded-owner and withdrawal-key source oracle
        run: node scripts/audit_legacy_channels_source.cjs
      - name: Legacy channels.js Rust direct commit and permanent settlement denial tests
        run: cargo test --frozen --test legacy_channel_audit
      - name: Legacy validity.js independent Node source Type0/7/8/9 predicate oracle
        run: node scripts/audit_legacy_validity_0789.cjs
      - name: Legacy validity.js Rust Type0/7/8/9 diagnostics and permanent admission denial
        run: cargo test --frozen --test legacy_validity_audit
      - name: Legacy types.js exact pinned source-blob and 36-route Node VM dispatch oracle
        run: node scripts/audit_legacy_types_dispatch.cjs
      - name: Legacy types.js Rust 36-route call-shape, prefix and permanent-denial audit
        run: cargo test --frozen --test legacy_types_audit
      - name: Legacy txDecoder.js exact-source VM 17-vector and malformed-body oracle
        run: node scripts/audit_legacy_txdecoder_source.cjs
      - name: Legacy txDecoder.js Rust 10-layout numeric/ref and permanent-denial adversaries
        run: cargo test --frozen --test legacy_txdecoder_audit
      - name: Legacy txEncoder.js original Node VM 22 golden source return and round-trip regressions
        run: node scripts/audit_legacy_txencoder_source.cjs
      - name: Legacy txEncoder.js Rust 14-family 256-bit/hash/amount and permanent-authority denials
        run: cargo test --frozen --test legacy_txencoder_audit
      - name: Runtime TXID indexing parallel serial-equivalence, bounded mock RPC and reorg denial
        run: cargo test --frozen --test parallel_txindex
      - name: Independent legacy and SegWit TXID/WTXID hashlib oracle
        run: python3 scripts/audit_txindex_hash_vectors.py
      - name: Allocation-free SegWit TXID hashing and mixed-block parallel equality
        run: cargo test --frozen --test txindex_hash_fastpath
      - name: Stage 8C independent Python raw block SHA256d Merkle and weight vectors
        run: python3 scripts/audit_raw_block_ingest_vectors.py
      - name: Stage 8C borrowed raw block bounds, one-call RPC, 10k mixed TX order and no authority
        run: cargo test --frozen --test raw_block_ingest
      - name: Stage 8D independent Python TXID dependency wave reference
        run: python3 scripts/audit_stage8d_dependency_waves.py
      - name: Stage 8D no-reparse worker path and fail-closed UTXO DAG waves
        run: cargo test --frozen --test stage8d_fused_dependency
      - name: Stage 8D1b one scoped TX worker team and serial-equivalent 10k TX proof
        run: cargo test --frozen --test stage8d_one_team
      - name: Stage 8D3 readonly dependency-wave barriers, cancellation and permanent denial
        run: cargo test --frozen --test stage8d_wave_precheck
      - name: Stage 8D4 candidate parent UTXO coverage, stale preindex and immutable denial
        run: cargo test --frozen --test stage8d_parent_utxo_snapshot
      - name: Legacy txIndex.js exact pinned source Node VM with fake RPC/DB and three-argument decoder
        run: node scripts/audit_legacy_txindex_source.cjs
      - name: Legacy txIndex.js Rust source marker offsets, vout-loss and permanent denial
        run: cargo test --frozen --test legacy_txindex_audit
      - name: Offline runtime multicore TXID source-order benchmark smoke (no performance threshold)
        run: cargo run --frozen --bin tradelayer-index-bench -- 1500 512 4 256 2
      - name: Stage 25F source-only exact rational bankruptcy threshold
        run: cargo test --frozen --test bankruptcy_source_audit
      - name: Verify Stage 25A isolated margin and funding atomicity
        run: cargo test --frozen --test clearing_sandbox
      - name: Verify Stage 25B single-ledger spot and clearing invariants
        run: cargo test --frozen --test spot_clearing_one_ledger
      - name: Verify Stage 25B collateral floors and fail-closed funding
        run: cargo test --frozen --test clearing_collateral_policy
      - name: Reject orphaned clearing replay history in legacy spot checkpoints
        run: cargo test --frozen --test clearing_checkpoint_fence
      - name: Legacy withdrawal amount mismatch audit
        run: node scripts/audit_legacy_withdrawal_codec.cjs
      - name: Legacy wire vector audit
        run: node scripts/generate_vectors.mjs --check
      - name: Binary wire vector audit
        run: node scripts/generate_v1_vectors.mjs --check
      - name: Offline real transaction fixture audit
        run: cargo run --frozen --bin tradelayer-scan -- fixtures/real_transactions.tsv
      - name: Offline synthetic marker fixture audit
        run: cargo run --frozen --bin tradelayer-scan -- fixtures/synthetic_transactions.tsv
      - name: Offline Litecoin RPC collector tests
        run: python3 -m unittest discover -s tests -p test_collect_litecoin_rpc.py -v
      - name: Litecoin first-input source trace and reorg tests (fake RPC only)
        run: python3 -m unittest discover -s tests -p test_litecoin_source_trace.py -v
      - name: Legacy comparison integration tests (fake decoder only)
        run: node tests/test_compare_legacy.cjs
      - name: Rust diagnostic export smoke test
        run: |
          cargo run --frozen --bin tradelayer-legacy-fields -- fixtures/synthetic_transactions.tsv > /tmp/tradelayer-rust-fields.tsv
          grep -q 'send' /tmp/tradelayer-rust-fields.tsv
      - name: Independent mainnet genesis identity audit
        run: python3 scripts/audit_network_profiles.py
      - name: Independent Bitcoin genesis and SHA256d inclusion vectors
        run: python3 scripts/audit_bitcoin_spv_vectors.py
      - name: Bitcoin mainnet bigint chainwork and retarget audit
        run: python3 scripts/audit_bitcoin_chainwork.py
      - name: Independent historical mainnet fork fixture audit
        run: python3 scripts/audit_bitcoin_forks.py
      - name: Historical Bitcoin genesis-to-block1 CLI header work smoke test
        run: |
          cargo run --frozen --bin tradelayer-bitcoin-work -- fixtures/bitcoin_mainnet_genesis_block1_headers.txt > /tmp/bitcoin-work-report.txt
          grep -Fxq 'anchor=PUBLISHED_BITCOIN_MAINNET_GENESIS' /tmp/bitcoin-work-report.txt
          grep -Fxq 'sha256d_pow=CHECKED' /tmp/bitcoin-work-report.txt
          grep -Fxq 'difficulty_transitions=CHECKED' /tmp/bitcoin-work-report.txt
          grep -Fxq 'last_height=1' /tmp/bitcoin-work-report.txt
          grep -Fxq 'chainwork=0000000000000000000000000000000000000000000000000000000200020002' /tmp/bitcoin-work-report.txt
          grep -Fxq 'best_active_chain=UNVERIFIED' /tmp/bitcoin-work-report.txt
      - name: Independent Node clearing call cadence and funding bucket vectors
        run: node scripts/audit_clearing_cadence.cjs --check
      - name: Independent Node BigInt funding direction and balance conservation
        run: node scripts/audit_funding_vectors.cjs --check
      - name: Optional legacy funding runner parses without local checkout
        run: node --check scripts/check_legacy_funding_runtime.cjs
      - name: Independent Node BigInt liquidation/insurance loss budgets
        run: node scripts/audit_liquidation_loss_budget.cjs --check
      - name: Independent Node BigInt cross-position PnL projections
        run: node scripts/audit_clearing_pnl.cjs --check
      - name: Independent Node BigInt clearing arithmetic vectors
        run: node scripts/audit_clearing_math.cjs --check
      - name: Independent Node BigInt spot matching vectors
        run: node scripts/audit_spot_vectors.cjs --check
      - name: TLPT state commitment cross-language audit
        run: python3 scripts/generate_tlpt_vectors.py --check
      - name: zkTL Cairo bridge Python checks
        run: python3 -m unittest discover -s tests -p test_tlzk_export.py -v
      - name: zkTL Cairo checkpoint metadata fixture audit
        run: cargo run --frozen --bin tradelayer-zk-inspect -- fixtures/zkTL_sample_batch.tsv
      - name: Synthetic TLPT zkTL root-bridge CLI smoke test
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python3 scripts/make_synthetic_tlpt_bridge.py "$tmp_dir"
          cargo run --frozen --bin tradelayer-root-reconcile -- \
            "$tmp_dir/synthetic_tlpt.tsv" fixtures/zkTL_sample_batch.tsv \
            "$tmp_dir/synthetic_observations.tsv" \
            "$(printf '0b%.0s' {1..32})" 132899 "$(printf '13%.0s' {1..32})" \
            132907 "$(printf '1b%.0s' {1..32})" > "$tmp_dir/report"
          grep -Fxq 'root_alignment=AUDIT_ONLY' "$tmp_dir/report"
          grep -Fxq 'transaction_inclusion=UNVERIFIED' "$tmp_dir/report"
          grep -Fxq 'root_namespaces=SEPARATE' "$tmp_dir/report"
          grep -Fxq 'receipts=26' "$tmp_dir/report"

  # The release build is independent of source-format/semantic tests and
  # consumes ~42s in the prior serial 84s workflow. Run it on another
  # isolated frozen runner; NEVER replace it with a debug build.
  release:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Enforce zero external Rust crates and frozen toolchain
        run: python3 scripts/check_rust_supply_chain.py
      - name: Release build without network or lockfile changes
        run: cargo build --all-targets --release --frozen
      - name: Release synthetic 8000-TX CPU preindex throughput measurement (no speedup gate)
        run: |
          target/release/tradelayer-index-bench 8000 512 4 512 3 > /tmp/txindex-release-perf.log
          cat /tmp/txindex-release-perf.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-release-perf.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-release-perf.log
      - name: Mixed 50-percent-SegWit 6000-TX release parallel benchmark (no speedup gate)
        run: |
          target/release/tradelayer-index-bench 6000 384 4 512 3 50 > /tmp/txindex-segwit-perf.log
          cat /tmp/txindex-segwit-perf.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-segwit-perf.log
          grep -Fxq 'segwit_percent=50' /tmp/txindex-segwit-perf.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-segwit-perf.log
      - name: Stage 8C release 4000-TX one-fetch zero-copy versus owned-Vec benchmark
        run: |
          target/release/tradelayer-block-ingest-bench 4000 4 50 3 > /tmp/txindex-bulk-perf.log
          cat /tmp/txindex-bulk-perf.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-bulk-perf.log
          grep -Fxq 'new_raw_tx_byte_copies=0' /tmp/txindex-bulk-perf.log
          grep -Fxq 'bulk_mock_rpc_calls_per_iteration=1' /tmp/txindex-bulk-perf.log
          grep -Fxq 'txid_merkle=LOCAL_CHECK_ONLY' /tmp/txindex-bulk-perf.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-bulk-perf.log
      - name: Stage 8D fused benchmark at 1000 TX single worker, 0 percent SegWit
        run: |
          target/release/tradelayer-block-ingest-bench 1000 1 0 2 > /tmp/txindex-8d-small.log
          cat /tmp/txindex-8d-small.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-8d-small.log
          grep -q '^full_owned_block_pipeline_median_ms=' /tmp/txindex-8d-small.log
          grep -q '^fused_prepared_only_median_ms=' /tmp/txindex-8d-small.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-8d-small.log
      - name: Stage 8D fused benchmark at 10000 TX eight workers, 95 percent SegWit
        run: |
          target/release/tradelayer-block-ingest-bench 10000 8 95 2 > /tmp/txindex-8d-large.log
          cat /tmp/txindex-8d-large.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-8d-large.log
          grep -q '^full_pipeline_speed_ratio=' /tmp/txindex-8d-large.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-8d-large.log
          grep -q '^one_team_prepared_only_median_ms=' /tmp/txindex-8d-large.log
          grep -q '^one_team_vs_windowed_ratio=' /tmp/txindex-8d-large.log
          grep -Fxq 'one_team_extra_result_slots=10000' /tmp/txindex-8d-large.log

  # Preserve the preexisting required "check" job name, but make it an
  # explicit AND over both independent jobs. A test or release failure,
  # cancellation, skipped check or superseded run MUST block promotion.
  check:
    needs: [tests, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce full frozen tests AND release build success
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          test "$TESTS_RESULT" = success
          test "$RELEASE_RESULT" = success
