name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded branch commits so only the newest proposal consumes CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check included snapshot file formatting
        run: rustfmt --check --edition 2021 src/registry_snapshot_impl.rs src/execution_snapshot_impl.rs src/ledger_channels_impl.rs src/ledger_settlement_impl.rs
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Legacy withdrawal amount mismatch audit
        run: node scripts/audit_legacy_withdrawal_codec.cjs
      - name: Legacy wire vector audit
        run: node scripts/generate_vectors.mjs --check
      - name: Binary wire vector audit
        run: node scripts/generate_v1_vectors.mjs --check
      - name: Offline real transaction fixture audit
        run: cargo run --locked --bin tradelayer-scan -- fixtures/real_transactions.tsv
      - name: Offline synthetic marker fixture audit
        run: cargo run --locked --bin tradelayer-scan -- fixtures/synthetic_transactions.tsv
      - name: Offline Litecoin RPC collector tests
        run: python3 -m unittest discover -s tests -p test_collect_litecoin_rpc.py -v
      - name: Legacy comparison integration tests (fake decoder only)
        run: node tests/test_compare_legacy.cjs
      - name: Rust diagnostic export smoke test
        run: |
          cargo run --locked --bin tradelayer-legacy-fields -- fixtures/synthetic_transactions.tsv > /tmp/tradelayer-rust-fields.tsv
          grep -q 'send' /tmp/tradelayer-rust-fields.tsv
      - name: Independent Bitcoin genesis and SHA256d inclusion vectors
        run: python3 scripts/audit_bitcoin_spv_vectors.py
      - name: Bitcoin mainnet bigint chainwork and retarget audit
        run: python3 scripts/audit_bitcoin_chainwork.py
      - name: TLPT state commitment cross-language audit
        run: python3 scripts/generate_tlpt_vectors.py --check
      - name: zkTL Cairo bridge Python checks
        run: python3 -m unittest discover -s tests -p test_tlzk_export.py -v
      - name: zkTL Cairo checkpoint metadata fixture audit
        run: cargo run --locked --bin tradelayer-zk-inspect -- fixtures/zkTL_sample_batch.tsv
      - name: Synthetic TLPT zkTL root-bridge CLI smoke test
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python3 scripts/make_synthetic_tlpt_bridge.py "$tmp_dir"
          cargo run --locked --bin tradelayer-root-reconcile -- \
            "$tmp_dir/synthetic_tlpt.tsv" fixtures/zkTL_sample_batch.tsv \
            "$tmp_dir/synthetic_observations.tsv" \
            "$(printf '0b%.0s' {1..32})" 132899 "$(printf '13%.0s' {1..32})" \
            132907 "$(printf '1b%.0s' {1..32})" > "$tmp_dir/report"
          grep -Fxq 'root_alignment=AUDIT_ONLY' "$tmp_dir/report"
          grep -Fxq 'transaction_inclusion=UNVERIFIED' "$tmp_dir/report"
          grep -Fxq 'root_namespaces=SEPARATE' "$tmp_dir/report"
          grep -Fxq 'receipts=26' "$tmp_dir/report"
