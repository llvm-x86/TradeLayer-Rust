name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Temporary formatter diagnostics
        run: |
          cargo fmt --all
          python3 -c 'import pathlib,base64; paths=["src/codec.rs","src/ledger.rs","src/chain.rs","src/lib.rs","tests/chain_progression.rs"]; [print("FORMAT_B64|"+p+"|"+base64.b64encode(pathlib.Path(p).read_bytes()).decode()) for p in paths]'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Legacy wire vector audit
        run: node scripts/generate_vectors.mjs --check
      - name: Binary wire vector audit
        run: node scripts/generate_v1_vectors.mjs --check
