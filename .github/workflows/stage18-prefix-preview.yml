name: Stage 18 native prefix checkpoint preview
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - ".stage18/**"
      - "scripts/preview_stage18_prefix.sh"
      - ".github/workflows/stage18-prefix-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage18-prefix-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout staged candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Verify exact native prefix/snapshot candidate
        run: bash scripts/preview_stage18_prefix.sh
