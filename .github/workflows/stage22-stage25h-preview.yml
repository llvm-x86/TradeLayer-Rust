name: Stage22 and Stage25H merge preflight
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - "scripts/preview_stage22_stage25h_merge.sh"
      - ".github/workflows/stage22-stage25h-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage22-25h-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  merged-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned Stage25G formal plus Stage25H preview
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Merge and verify full frozen Rust tree
        run: bash scripts/preview_stage22_stage25h_merge.sh
      - name: Verify Lean proofs and independent axiom audit
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          leanchecker-args: "TradeLayerFormal"
          axiom-audit: true
          axiom-audit-root: "TradeLayerFormal"
      - name: Verify all Kani harnesses on combined Rust
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          CARGO_NET_OFFLINE: 'false'
        with:
          kani-version: "0.68.0"
          command: cargo-kani
