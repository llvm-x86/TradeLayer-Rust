name: Stage 19 explicit lower-bound preflight
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - ".stage19/**"
      - "scripts/preview_stage19_lower_bound.sh"
      - ".github/workflows/stage19-lower-bound-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage19-lower-bound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Test exact staged Rust source with full preflight
        run: bash scripts/preview_stage19_lower_bound.sh
      - name: Verify existing twelve Kani harnesses on real new search code
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          CARGO_NET_OFFLINE: 'false'
        with:
          kani-version: '0.68.0'
          command: cargo-kani
