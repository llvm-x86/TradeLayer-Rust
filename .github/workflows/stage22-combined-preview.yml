name: Stage22 composed native-key Kani preflight
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - ".stage22/**"
      - "scripts/preview_stage22_combined.sh"
      - ".github/workflows/stage22-combined-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage22-combined-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verified-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout staged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Validate exact composed source via full preflight
        run: bash scripts/preview_stage22_combined.sh
      - name: Verify composed native account and property Kani harnesses
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          CARGO_NET_OFFLINE: 'false'
        with:
          kani-version: '0.68.0'
          command: cargo-kani
