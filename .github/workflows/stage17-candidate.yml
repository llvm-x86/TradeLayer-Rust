name: Stage 17 candidate Rust preflight
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - '.stage17/**'
      - 'scripts/preview_stage17_candidate.sh'
      - '.github/workflows/stage17-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage17-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  staged-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Validate staged source under exact frozen Cargo policy
        run: bash scripts/preview_stage17_candidate.sh
      - name: Prove bounded new and existing Kani harnesses on staged source
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          CARGO_NET_OFFLINE: 'false'
        with:
          kani-version: "0.68.0"
          command: cargo-kani
