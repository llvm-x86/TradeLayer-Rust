name: Stage 21 formal + Stage 25C merge preview
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - "scripts/preview_stage21_stage25c_merge.sh"
      - ".github/workflows/stage21-stage25c-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage21-stage25c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  merged-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Run merged Rust preflight, security and Stage25C checks
        run: bash scripts/preview_stage21_stage25c_merge.sh
      - name: Lean kernel and axiom audit of merged tree
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          leanchecker-args: 'TradeLayerFormal'
          axiom-audit: true
          axiom-audit-root: 'TradeLayerFormal'
      - name: Kani on merged source
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          CARGO_NET_OFFLINE: 'false'
        with:
          kani-version: '0.68.0'
          command: cargo-kani
