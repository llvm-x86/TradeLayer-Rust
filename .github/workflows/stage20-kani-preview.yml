name: Stage20 symbolic lower-bound Kani preflight
on:
  pull_request:
    branches: [formal/protocol-safety-lean-v1]
    paths:
      - ".stage20/**"
      - "scripts/preview_stage20_kani.sh"
      - ".github/workflows/stage20-kani-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage20-ord-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  staged:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install approved Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Run complete local-equivalent Rust preflight on actual candidate source
        run: bash scripts/preview_stage20_kani.sh
      - name: Run Kani on exact staged actual Vec-backed source
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          CARGO_NET_OFFLINE: 'false'
        with:
          kani-version: '0.68.0'
          command: cargo-kani
