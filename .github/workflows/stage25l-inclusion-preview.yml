name: Stage25L Bitcoin channel inclusion prepublication
on:
  pull_request:
    branches: [main]
    paths:
      - "ci/stage25l/**"
      - ".github/workflows/stage25l-inclusion-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage25l-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staged-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout pinned staged-only candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Stage exact source and run frozen prepublication checks
        run: bash ci/stage25l/preflight.sh
